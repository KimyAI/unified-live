[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-live"
version = "0.1.0"
description = "A local, modular desktop cockpit for real-time face and voice engines"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=1.26,<3", "PySide6>=6.7,<7", "opencv-python-headless>=4.10,<5",
  "sounddevice>=0.5,<1", "psutil>=6,<8", "nvidia-ml-py>=12,<14",
  "pyvirtualcam>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
unified-live = "unified_live.__main__:main"

[tool.setuptools.packages.find]
include = ["unified_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
